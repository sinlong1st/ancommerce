<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AnCommerce</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#FBF6F0; --surface:#fff; --surface-2:#F4E9DD; --ink:#2A1E14; --muted:#8A7A6A;
  --primary:#C2683C; --on-primary:#fff; --accent:#2E8B8B; --accent-2:#E8A93C;
  --border:#ECDFD0; --ring:rgba(194,104,60,.35);
  --font-display:'Baloo 2',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif;
  --display-weight:800; --radius-card:26px; --radius-btn:999px; --radius-pill:999px;
  --shadow-sm:0 2px 0 rgba(42,30,20,.06); --shadow-md:0 18px 40px -22px rgba(194,104,60,.5);
  --shadow-card:0 24px 48px -30px rgba(42,30,20,.3);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ece9f1}
.ac-app{
  background:var(--bg); color:var(--ink); min-height:100vh;
  font-family:var(--font-body); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}
.ac-main{flex:1}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:var(--display-weight);margin:0;letter-spacing:-.01em;line-height:1.08}
button{font-family:inherit}
.container{max-width:1200px;margin:0 auto;padding:0 24px;width:100%}
.section{padding:54px 24px}
.section__head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px}
.section__kicker{display:block;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:6px}
.section__title{font-size:clamp(26px,3.4vw,38px)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}

/* ── Buttons ─────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:none;cursor:pointer;
  font-family:var(--font-display);font-weight:700;font-size:15px;border-radius:var(--radius-btn);
  padding:12px 22px;transition:transform .14s ease,box-shadow .2s ease,filter .15s ease,background .15s;line-height:1}
.btn--lg{padding:16px 28px;font-size:17px}
.btn--block{width:100%}
.btn--primary{background:var(--primary);color:var(--on-primary);box-shadow:var(--shadow-md)}
.btn--primary:hover{transform:translateY(-2px);filter:brightness(1.05)}
.btn--primary:active{transform:translateY(0)}
.btn--secondary{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 2px var(--border)}
.btn--secondary:hover{box-shadow:inset 0 0 0 2px var(--ink);transform:translateY(-2px)}
.btn--ghost{background:transparent;color:var(--primary)}
.link{display:inline-flex;align-items:center;gap:6px;background:none;border:none;cursor:pointer;
  color:var(--primary);font-family:var(--font-display);font-weight:700;font-size:15px}
.link:hover{gap:9px;transition:gap .15s}

/* ── Nav ─────────────────────────────────────────────── */
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--surface) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}
.nav__inner{display:flex;align-items:center;gap:20px;height:72px}
.brand{display:inline-flex;align-items:center;gap:10px;background:none;border:none;cursor:pointer;color:var(--ink)}
.brand__mark{width:38px;height:38px;border-radius:12px;background:var(--primary);color:var(--on-primary);
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md)}
.brand__name{font-family:var(--font-display);font-weight:800;font-size:21px;letter-spacing:-.02em}
.brand__name span{color:var(--primary)}
.nav__search{flex:1;max-width:440px;display:flex;align-items:center;gap:10px;background:var(--surface-2);
  border:1.5px solid transparent;border-radius:999px;padding:10px 18px;color:var(--muted)}
.nav__search:focus-within{border-color:var(--ring);background:var(--surface)}
.nav__search input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--ink);font-family:var(--font-body)}
.nav__links{display:flex;align-items:center;gap:6px}
.nav__link{background:none;border:none;cursor:pointer;color:var(--ink);font-family:var(--font-display);font-weight:700;
  font-size:15px;padding:9px 14px;border-radius:999px}
.nav__link:hover{background:var(--surface-2)}
.nav__link.is-active{color:var(--primary)}
.cartbtn{position:relative;background:var(--surface-2);border:none;cursor:pointer;color:var(--ink);
  width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-left:4px}
.cartbtn:hover{background:var(--primary);color:var(--on-primary)}
.cart-count{position:absolute;top:-3px;right:-3px;min-width:21px;height:21px;padding:0 5px;border-radius:999px;
  background:var(--accent-2);color:#241133;font-family:var(--font-display);font-weight:800;font-size:12px;
  display:flex;align-items:center;justify-content:center;border:2px solid var(--surface)}

/* ── Hero ────────────────────────────────────────────── */
.hero{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--surface-2),var(--bg))}
.hero__inner{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding:64px 24px 72px;position:relative;z-index:2}
.hero--centered .hero__inner{grid-template-columns:1fr;text-align:center;justify-items:center;max-width:820px}
.hero__blob{position:absolute;border-radius:50%;filter:blur(8px);opacity:.5;z-index:1}
.hero__blob--1{width:280px;height:280px;background:var(--primary);top:-90px;right:8%;opacity:.16}
.hero__blob--2{width:220px;height:220px;background:var(--accent);bottom:-80px;left:-40px;opacity:.18}
.hero__blob--3{width:160px;height:160px;background:var(--accent-2);top:40%;right:42%;opacity:.22}
.hero__eyebrow{display:inline-flex;align-items:center;gap:7px;background:var(--surface);color:var(--ink);
  font-weight:800;font-size:13px;padding:8px 14px;border-radius:999px;box-shadow:var(--shadow-sm);border:1px solid var(--border)}
.hero__title{font-size:clamp(38px,5.6vw,68px);margin:20px 0 0;letter-spacing:-.025em}
.hero__hl{color:var(--primary)}
.hero__sub{font-size:clamp(16px,1.4vw,19px);color:var(--muted);max-width:480px;margin:18px 0 0;line-height:1.55;font-weight:500}
.hero--centered .hero__sub{margin-inline:auto}
.hero__cta{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
.hero--centered .hero__cta{justify-content:center}
.hero__stats{display:flex;align-items:center;gap:22px;margin-top:36px}
.hero__stats strong{font-family:var(--font-display);font-weight:800;font-size:24px;display:block}
.hero__stats span{font-size:13px;color:var(--muted);font-weight:600}
.hero__div{width:1px;height:34px;background:var(--border)}
.hero__art{position:relative}
.hero__imgwrap{position:relative;aspect-ratio:4/4.4;border-radius:30px;overflow:hidden;
  box-shadow:var(--shadow-card);border:1px solid var(--border);background:var(--surface);
  background-image:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--accent) 22%,transparent),transparent 55%),radial-gradient(circle at 75% 80%,color-mix(in srgb,var(--primary) 22%,transparent),transparent 55%)}
.hero__sticker{position:absolute;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-md);
  font-family:var(--font-display);font-weight:800;border-radius:16px}
.hero__sticker--ship{display:flex;align-items:center;gap:8px;padding:11px 15px;font-size:14px;left:-18px;bottom:46px;color:var(--ink)}
.hero__sticker--ship svg{color:var(--accent)}
.hero__sticker--off{top:24px;right:-14px;width:78px;height:78px;border-radius:50%;background:var(--accent-2);color:#241133;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;border:none}
.hero__sticker--off small{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}

/* ── Category tiles ──────────────────────────────────── */
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--radius-card);padding:18px;cursor:pointer;text-align:left;
  transition:transform .15s,box-shadow .2s,border-color .2s;color:var(--ink)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-card);border-color:var(--tile)}
.tile__name{font-family:var(--font-display);font-weight:700;font-size:15px;line-height:1.2}
.tile__go{position:absolute;top:16px;right:16px;color:var(--tile);opacity:0;transition:opacity .2s,transform .2s;transform:translateX(-4px)}
.tile:hover .tile__go{opacity:1;transform:translateX(0)}

/* ── Product grid + card ─────────────────────────────── */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.grid--shop{grid-template-columns:repeat(auto-fill,minmax(248px,1fr))}
.card{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);overflow:hidden;box-shadow:var(--shadow-card);transition:transform .16s,box-shadow .22s}
.card:hover{transform:translateY(-5px)}
.card__media{position:relative;aspect-ratio:1/1;border:none;padding:0;cursor:pointer;width:100%;display:block;background:none}
.pimg{position:absolute;inset:0;width:100%;height:100%}
.ribbon{position:absolute;top:12px;left:12px;z-index:3;color:#fff;font-family:var(--font-display);font-weight:800;
  font-size:12px;padding:5px 11px;border-radius:999px;box-shadow:var(--shadow-md);letter-spacing:.01em}
.card__body{padding:16px 16px 18px;display:flex;flex-direction:column;gap:9px;flex:1}
.card__cat{display:inline-flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;padding:0;
  color:var(--muted);font-weight:700;font-size:12.5px;letter-spacing:.02em}
.card__cat:hover{color:var(--ink)}
.card__name{font-size:16px;line-height:1.25;min-height:2.5em}
.card__name button{background:none;border:none;cursor:pointer;color:inherit;font:inherit;text-align:left;padding:0}
.card__name button:hover{color:var(--primary)}
.card__foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:4px}
.price{display:flex;align-items:baseline;gap:8px}
.price__now{font-family:var(--font-display);font-weight:800;font-size:20px}
.price__was{color:var(--muted);text-decoration:line-through;font-size:14px;font-weight:600}
.card__add{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:var(--primary);color:var(--on-primary);
  display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--shadow-md);transition:transform .14s,filter .15s}
.card__add:hover{transform:scale(1.1) rotate(90deg);filter:brightness(1.05)}

/* ── Stars ───────────────────────────────────────────── */
.stars{display:inline-flex;align-items:center;gap:1px}
.stars__s{color:var(--border);display:inline-flex}
.stars__s.is-on{color:var(--accent-2)}
.stars__s.is-on svg{fill:var(--accent-2)}
.stars__count{margin-left:7px;color:var(--muted);font-size:12.5px;font-weight:600}

/* ── Qty stepper ─────────────────────────────────────── */
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--border);border-radius:999px;background:var(--surface)}
.qty button{width:40px;height:40px;border:none;background:none;cursor:pointer;color:var(--ink);display:inline-flex;
  align-items:center;justify-content:center;border-radius:50%}
.qty button:hover:not(:disabled){background:var(--surface-2);color:var(--primary)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty__val{min-width:34px;text-align:center;font-family:var(--font-display);font-weight:800;font-size:16px}
.qty--sm button{width:32px;height:32px}
.qty--sm .qty__val{min-width:28px;font-size:14px}

/* ── Values + promo ──────────────────────────────────── */
.values{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.value{display:flex;gap:15px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);padding:24px}
.value__ic{flex:none;width:48px;height:48px;border-radius:14px;background:var(--surface-2);color:var(--primary);
  display:inline-flex;align-items:center;justify-content:center}
.value h3{font-size:17px;margin-bottom:5px}
.value p{margin:0;color:var(--muted);font-size:14px;line-height:1.5;font-weight:500}
.promo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:32px;flex-wrap:wrap;
  background:var(--ink);color:#fff;border-radius:calc(var(--radius-card) + 6px);padding:44px 48px}
.promo__blob{position:absolute;width:360px;height:360px;border-radius:50%;background:var(--primary);opacity:.35;
  filter:blur(10px);top:-120px;right:-60px}
.promo__copy{position:relative;z-index:2;max-width:520px}
.promo__kicker{display:inline-flex;align-items:center;gap:7px;color:var(--accent-2);font-weight:800;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.promo__copy h2{font-size:clamp(26px,3vw,36px);margin:12px 0 10px;color:#fff}
.promo__copy p{margin:0;opacity:.8;line-height:1.55;font-weight:500}
.promo__form{position:relative;z-index:2;display:flex;gap:10px;flex-wrap:wrap}
.promo__form input{border:none;border-radius:var(--radius-btn);padding:15px 20px;font-size:15px;min-width:240px;
  font-family:var(--font-body);outline:none}

/* ── Shop ────────────────────────────────────────────── */
.shop__hero{background:linear-gradient(160deg,var(--surface-2),var(--bg));padding:40px 0 30px;border-bottom:1px solid var(--border)}
.shop__title{font-size:clamp(30px,4vw,46px);margin:10px 0 8px}
.shop__lede{color:var(--muted);font-size:16px;font-weight:500;margin:0}
.crumbs{display:inline-flex;align-items:center;gap:7px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-weight:700;font-size:14px;padding:0;margin-bottom:6px}
.crumbs:hover{color:var(--primary)}
.crumbs span{color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 16px}
.toolbar__search{flex:1;min-width:240px;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1.5px solid var(--border);border-radius:999px;padding:12px 18px;color:var(--muted)}
.toolbar__search:focus-within{border-color:var(--ring)}
.toolbar__search input{flex:1;border:none;background:none;outline:none;font-size:15px;color:var(--ink);font-family:var(--font-body)}
.toolbar__clear{background:none;border:none;cursor:pointer;color:var(--muted);display:inline-flex}
.toolbar__clear:hover{color:var(--primary)}
.sortsel{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:14px}
.sortsel__box{position:relative;display:inline-flex;align-items:center}
.sortsel select{appearance:none;-webkit-appearance:none;border:1.5px solid var(--border);background:var(--surface);
  color:var(--ink);font-family:var(--font-body);font-weight:700;font-size:14px;padding:11px 40px 11px 16px;
  border-radius:999px;cursor:pointer;outline:none}
.sortsel select:focus{border-color:var(--ring)}
.sortsel__box svg{position:absolute;right:14px;pointer-events:none;color:var(--muted)}
.pills{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--border);
  cursor:pointer;color:var(--ink);font-family:var(--font-display);font-weight:700;font-size:14px;padding:9px 16px;border-radius:999px;
  transition:border-color .15s,background .15s,color .15s}
.pill:hover{border-color:var(--pill,var(--ink))}
.pill__dot{width:9px;height:9px;border-radius:50%}
.pill.is-active{background:var(--ink);color:#fff;border-color:var(--ink)}
.pill.is-active .pill__dot{box-shadow:0 0 0 2px rgba(255,255,255,.4)}
.shop__count{color:var(--muted);font-weight:700;font-size:14px;margin-bottom:18px}
.empty{text-align:center;padding:60px 20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.empty--lg{padding:90px 20px}
.empty__ic{width:72px;height:72px;border-radius:50%;background:var(--surface-2);color:var(--primary);
  display:inline-flex;align-items:center;justify-content:center;margin-bottom:10px}
.empty h3{font-size:23px}
.empty p{color:var(--muted);margin:0 0 14px;font-weight:500}

/* ── Product detail ──────────────────────────────────── */
.pdp{padding:26px 0 40px}
.pdp__grid{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:14px;align-items:start}
.pdp__media{position:sticky;top:92px}
.pdp__main{position:relative;aspect-ratio:1/1;border-radius:24px;overflow:hidden;border:1px solid var(--border);box-shadow:var(--shadow-card)}
.pdp__thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:12px}
.pdp__thumb{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.pdp__cat{display:inline-flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;padding:0;
  color:var(--muted);font-weight:700;font-size:14px}
.pdp__cat:hover{color:var(--ink)}
.pdp__name{font-size:clamp(28px,3.5vw,42px);margin:10px 0 6px}
.pdp__tagline{color:var(--muted);font-size:17px;font-weight:600;margin:0 0 14px}
.pdp__rate{margin-bottom:18px}
.pdp__price{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.pdp__now{font-family:var(--font-display);font-weight:800;font-size:34px}
.pdp__was{color:var(--muted);text-decoration:line-through;font-size:19px;font-weight:600}
.pdp__save{background:color-mix(in srgb,var(--accent-2) 30%,var(--surface));color:var(--ink);font-family:var(--font-display);
  font-weight:800;font-size:13px;padding:5px 11px;border-radius:999px}
.pdp__desc{color:var(--ink);opacity:.82;line-height:1.6;font-size:15.5px;font-weight:500;margin:0 0 18px}
.pdp__stock{display:inline-flex;align-items:center;gap:9px;font-weight:700;font-size:14px;color:var(--accent);margin-bottom:22px}
.pdp__stockdot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.pdp__stock.is-low{color:#E8800E}
.pdp__stock.is-low .pdp__stockdot{background:#E8800E;box-shadow:0 0 0 4px rgba(232,128,14,.2)}
.pdp__buy{display:flex;gap:12px;align-items:stretch;margin-bottom:14px}
.pdp__buy .qty{flex:none}
.pdp__buy .btn{flex:1}
.pdp__wish{display:inline-flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;color:var(--muted);
  font-family:var(--font-display);font-weight:700;font-size:14px;padding:4px 0;margin-bottom:22px}
.pdp__wish:hover{color:var(--primary)}
.pdp__perks{display:flex;gap:22px;flex-wrap:wrap;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-bottom:22px}
.pdp__perks span{display:inline-flex;align-items:center;gap:9px;color:var(--ink);font-weight:600;font-size:14px}
.pdp__perks svg{color:var(--primary)}
.pdp__tabbar{display:flex;gap:6px;margin-bottom:16px}
.pdp__tab{background:none;border:none;cursor:pointer;font-family:var(--font-display);font-weight:700;font-size:15px;
  color:var(--muted);padding:8px 0;margin-right:18px;border-bottom:2.5px solid transparent}
.pdp__tab.is-active{color:var(--ink);border-color:var(--primary)}
.pdp__hl{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pdp__hl li{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;font-weight:600;color:var(--ink)}
.pdp__check{flex:none;width:22px;height:22px;border-radius:50%;background:color-mix(in srgb,var(--accent) 20%,var(--surface));
  color:var(--accent);display:inline-flex;align-items:center;justify-content:center;margin-top:1px}
.pdp__ship p{margin:0 0 12px;color:var(--muted);line-height:1.6;font-size:14.5px;font-weight:500}
.pdp__ship strong{color:var(--ink)}

/* ── Cart ────────────────────────────────────────────── */
.pagepad{padding:32px 24px 60px}
.pagetitle{font-size:clamp(28px,3.6vw,40px);margin-bottom:26px}
.pagetitle span{color:var(--muted);font-weight:700;font-size:.6em}
.cart{display:grid;grid-template-columns:1fr 360px;gap:30px;align-items:start}
.cart__lines{display:flex;flex-direction:column;gap:14px}
.freebar{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:15px 18px}
.freebar__top{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;margin-bottom:10px}
.freebar__top svg{color:var(--accent)}
.freebar__track{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.freebar__fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--primary));transition:width .4s ease}
.line{display:flex;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px}
.line__media{position:relative;width:96px;height:96px;flex:none;border-radius:14px;overflow:hidden}
.line__main{flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.line__top{display:flex;justify-content:space-between;gap:12px}
.line__cat{font-weight:700;font-size:12px;letter-spacing:.02em}
.line__name{font-size:16.5px;margin-top:3px}
.line__rm{background:none;border:none;cursor:pointer;color:var(--muted);height:fit-content;display:inline-flex}
.line__rm:hover{color:var(--accent-2)}
.line__bottom{display:flex;align-items:center;justify-content:space-between;gap:12px}
.line__price{text-align:right}
.line__total{font-family:var(--font-display);font-weight:800;font-size:18px;display:block}
.line__each{font-size:12px;color:var(--muted);font-weight:600}
.cart__continue{margin-top:6px}

/* ── Summary ─────────────────────────────────────────── */
.sum{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:24px;
  box-shadow:var(--shadow-card);position:sticky;top:92px}
.sum__title{font-size:20px;margin-bottom:16px}
.sum__rows{display:flex;flex-direction:column;gap:11px;margin:6px 0 18px}
.sum__row{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:600}
.sum__row span:last-child{color:var(--ink);font-weight:700}
.sum__free{font-style:normal;color:var(--accent);font-weight:800}
.sum__row--total{padding-top:13px;border-top:1px solid var(--border);font-size:18px}
.sum__row--total span{color:var(--ink) !important;font-family:var(--font-display);font-weight:800;font-size:21px}
.sum__trust{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:13px;font-weight:600;margin-top:14px}
.sum--checkout{position:static}
.sum__items{display:flex;flex-direction:column;gap:12px;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.sum__item{display:flex;align-items:center;gap:12px}
.sum__thumb{position:relative;width:52px;height:52px;flex:none;border-radius:12px;overflow:hidden}
.sum__qty{position:absolute;top:-7px;right:-7px;min-width:21px;height:21px;border-radius:999px;background:var(--ink);color:#fff;
  font-family:var(--font-display);font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;border:2px solid var(--surface);padding:0 4px}
.sum__iname{flex:1;font-size:14px;font-weight:600;line-height:1.3}
.sum__iprice{font-family:var(--font-display);font-weight:800;font-size:14.5px}

/* ── Checkout ────────────────────────────────────────── */
.checkout{display:grid;grid-template-columns:1fr 380px;gap:30px;align-items:start;margin-top:8px}
.checkout__main{display:flex;flex-direction:column;gap:18px}
.fcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:24px}
.fcard__head{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.fcard__head h2{font-size:19px}
.fcard__num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-family:var(--font-display);
  font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center}
.fcard__secure{margin-left:auto;display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field--full{grid-column:1/-1}
.field__label{font-weight:700;font-size:13.5px;color:var(--ink)}
.input{border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;font-family:var(--font-body);
  color:var(--ink);background:var(--surface);outline:none;transition:border-color .15s}
.input:focus{border-color:var(--ring)}
.input.is-error{border-color:var(--accent-2);background:color-mix(in srgb,var(--accent-2) 8%,var(--surface))}
.field__err{color:#D81E5B;font-size:12.5px;font-weight:700}
.checkout__demo{margin:14px 0 0;color:var(--muted);font-size:13px;font-weight:600}

/* ── Confirmation ────────────────────────────────────── */
.confirm{max-width:600px;margin:30px auto;text-align:center}
.confirm__tick{width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;
  align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 16px 40px -16px var(--accent)}
.confirm h1{font-size:clamp(28px,4vw,40px)}
.confirm__sub{color:var(--muted);font-size:16px;font-weight:500;margin:10px 0 26px}
.confirm__card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-card);padding:26px;
  box-shadow:var(--shadow-card);text-align:left;margin-bottom:26px}
.confirm__meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--border);margin-bottom:18px}
.confirm__meta span{display:block;color:var(--muted);font-size:12.5px;font-weight:700;margin-bottom:4px}
.confirm__meta strong{font-family:var(--font-display);font-weight:800;font-size:16px}
.confirm__items{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.confirm__item{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600}
.confirm__item span:last-child{font-family:var(--font-display);font-weight:800}

/* ── Toast ───────────────────────────────────────────── */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:100;display:flex;align-items:center;gap:11px;
  background:var(--ink);color:#fff;padding:14px 20px;border-radius:999px;box-shadow:0 18px 44px -16px rgba(0,0,0,.5);
  font-family:var(--font-display);font-weight:700;font-size:15px;animation:toastIn .3s cubic-bezier(.2,.9,.3,1.4)}
.toast__ic{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}

/* ── Footer ──────────────────────────────────────────── */
.foot{background:var(--surface);border-top:1px solid var(--border);margin-top:30px}
.foot__inner{display:grid;grid-template-columns:1.3fr 2fr;gap:40px;padding:48px 24px 30px}
.foot__brand .brand__mark{margin-bottom:0}
.foot__brand{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.foot__brand p{color:var(--muted);font-size:14px;line-height:1.55;font-weight:500;margin:6px 0 0;max-width:300px}
.foot__cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.foot__cols h4{font-size:14px;margin-bottom:12px}
.foot__cols button{display:block;background:none;border:none;cursor:pointer;color:var(--muted);font-family:var(--font-body);
  font-weight:600;font-size:14px;padding:5px 0;text-align:left}
.foot__cols button:hover{color:var(--primary)}
.foot__base{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;
  padding:18px 24px;border-top:1px solid var(--border);color:var(--muted);font-size:13px;font-weight:600}
.foot__pay{display:inline-flex;align-items:center;gap:7px}

/* tweak panel blurb */
.tweak-blurb{margin:-2px 0 4px;color:var(--muted,#888);font-size:12px;font-style:italic;padding:0 2px}

/* ── Responsive ──────────────────────────────────────── */
@media(max-width:1000px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .grid{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:880px){
  .hero__inner{grid-template-columns:1fr;text-align:left}
  .hero__art{display:none}
  .pdp__grid{grid-template-columns:1fr;gap:28px}
  .pdp__media{position:static}
  .cart{grid-template-columns:1fr}
  .checkout{grid-template-columns:1fr}
  .sum{position:static}
  .values{grid-template-columns:1fr}
  .nav__search{display:none}
  .grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:560px){
  .container{padding:0 16px}
  .section{padding:40px 16px}
  .pagepad{padding:24px 16px 48px}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:repeat(2,1fr);gap:14px}
  .grid--shop{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .pdp__hl{grid-template-columns:1fr}
  .nav__links .nav__link{display:none}
  .promo{padding:32px 24px}
  .hero__stats{gap:14px}
  .card__name{font-size:15px}
}
</style>
</head>
